# Ansible-managed SSH configuration fragment
# File: /etc/ssh/sshd_config.d/98-ansible.conf

# === Global security policies ===
PermitRootLogin prohibit-password
PasswordAuthentication no
ChallengeResponseAuthentication no
UsePAM yes
X11Forwarding no

# === Key-only access enforcement ===
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys

# === Specific rule for root login with pubkey only ===
Match User root
    AuthenticationMethods publickey
    PermitRootLogin yes