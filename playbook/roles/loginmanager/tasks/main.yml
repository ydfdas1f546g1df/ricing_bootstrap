---
- name: Install SDDM
  ansible.builtin.pacman:
    name: sddm
    state: present

- name: Create sddm config dir
  ansible.builtin.file:
    name: /etc/sddm.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy Hyprland Session File
  ansible.builtin.template:
    src: hyprland.desktop
    dest: /usr/share/wayland-sessions/hyprland.desktop
    owner: root
    group: root
    mode: '0644'

- name: Copy Config File
  ansible.builtin.template:
    src: 10-hyprland.conf.j2
    dest: /etc/sddm.conf.d/10-hyprland.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart sddm

- name: Enable SDDM
  ansible.builtin.systemd:
    name: sddm.service
    enabled: true
    state: started