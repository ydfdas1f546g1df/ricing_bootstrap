---
- name: Check if yay is installed
  ansible.builtin.command:
    cmd: yay --version
  register: yay_check
  ignore_errors: yes

- name: Clone YAY from AUR
  become: yes
  become_user: "{{ ansible_user_id }}"
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay.git
    dest: /tmp/yay
    version: master
    clone: yes
    update: no
  when: yay_check.rc != 0

- name: Build && Install YAY
  become: yes
  become_user: "{{ ansible_user_id }}"
  ansible.builtin.command:
    cmd: makepkg -si --noconfirm
    chdir: /tmp/yay
  register: yay_install
  until: yay_install is succeeded
  retries: 3
  delay: 5
  when: yay_check.rc != 0

- name: Remove YAY source
  become: yes
  ansible.builtin.file:
    path: /tmp/yay
    state: absent
  when: yay_check.rc != 0
