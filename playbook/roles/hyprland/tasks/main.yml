---
- name: Install Hyprland
  ansible.builtin.pacman:
    name: hyprland
    state: present

- name: Create Hyprland config directory
  ansible.builtin.file:
    path: /etc/hypr
    state: directory
    owner: root
    group: root
    mode: '0755'


- name: Copy Hyprland config
  ansible.builtin.template:
    src: hyprland.conf
    dest: /etc/hypr/hyprland.conf

